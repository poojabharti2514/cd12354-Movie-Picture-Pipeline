name: Frontend Continuous Deployment

# Required GitHub secrets:
#   AWS_ACCESS_KEY_ID, AWS_SECRET_ACCESS_KEY
#     Access keys for the github-action-user IAM user.
#   REACT_APP_MOVIE_API_URL
#     Public backend URL baked into the frontend image, for example
#     http://<backend-load-balancer-dns>. Deploy the backend first, then set this.

on:
  push:
    branches:
      - main
    paths:
      - 'starter/frontend/**'

  workflow_dispatch:

env:
  AWS_REGION: us-east-1
  EKS_CLUSTER: cluster
  ECR_REPOSITORY: frontend

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: starter/frontend

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: 'starter/frontend/.nvmrc'
          cache: npm
          cache-dependency-path: 'starter/frontend/package-lock.json'

      - name: Install dependencies
        run: npm ci

      - name: Run lint
        run: npm run lint

  test:
    name: Test
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: starter/frontend

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: 'starter/frontend/.nvmrc'
          cache: npm
          cache-dependency-path: 'starter/frontend/package-lock.json'

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: CI=true npm test

  build:
    name: Build
    runs-on: ubuntu-latest
    needs:
      - lint
      - test
    outputs:
      image: ${{ steps.push.outputs.image }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build and push image
        id: push
        working-directory: starter/frontend
        env:
          REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          REPOSITORY: ${{ env.ECR_REPOSITORY }}
          IMAGE_TAG: ${{ github.sha }}
          API_URL: ${{ secrets.REACT_APP_MOVIE_API_URL }}
        run: |
          if [ -z "$API_URL" ]; then
            echo "Missing GitHub secret REACT_APP_MOVIE_API_URL."
            echo "Set it to the public backend URL, for example http://<backend-load-balancer-dns>."
            exit 1
          fi
          image="$REGISTRY/$REPOSITORY:$IMAGE_TAG"
          docker build \
            --build-arg "REACT_APP_MOVIE_API_URL=$API_URL" \
            --tag "$image" .
          docker push "$image"
          echo "image=$image" >> "$GITHUB_OUTPUT"

  deploy:
    name: Deploy
    runs-on: ubuntu-latest
    needs:
      - build

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Install kubectl
        run: |
          curl -fsSL -o kubectl "https://dl.k8s.io/release/v1.35.0/bin/linux/amd64/kubectl"
          sudo install -o root -g root -m 0755 kubectl /usr/local/bin/kubectl
          kubectl version --client

      - name: Install kustomize
        run: |
          curl -fsSL -o kustomize.tar.gz "https://github.com/kubernetes-sigs/kustomize/releases/download/kustomize%2Fv5.6.0/kustomize_v5.6.0_linux_amd64.tar.gz"
          tar -xzf kustomize.tar.gz
          sudo install -o root -g root -m 0755 kustomize /usr/local/bin/kustomize
          kustomize version

      - name: Configure kubeconfig
        run: aws eks update-kubeconfig --name "$EKS_CLUSTER" --region "$AWS_REGION"

      - name: Deploy manifests
        working-directory: starter/frontend/k8s
        run: |
          kustomize edit set image "frontend=${{ needs.build.outputs.image }}"
          kustomize build . | kubectl apply -f -
          kubectl rollout status deployment/frontend --timeout=300s

      - name: Show service URL
        run: |
          kubectl get svc frontend -n default
          host=$(kubectl get svc frontend -n default -o jsonpath='{.status.loadBalancer.ingress[0].hostname}')
          if [ -n "$host" ]; then
            echo "Frontend URL: http://${host}"
          else
            echo "LoadBalancer hostname is not assigned yet. Check kubectl get svc frontend in a few minutes."
          fi
